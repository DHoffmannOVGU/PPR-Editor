<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      Chromium reports "ResizeObserver loop completed with undelivered
      notifications" as a window error carrying no Error object whenever
      observed elements settle across two frames. React Flow measures every
      node that way, so adding or reprojecting nodes raises it routinely. It is
      a browser notice rather than an application fault, but the dev
      runtime-error overlay turns it into a full-screen modal that swallows
      every canvas gesture behind it. This listener has to win the race against
      the overlay's own listener, and a classic script runs while the document
      is still parsing, before any deferred module the dev server injects.
    -->
    <script>
      window.addEventListener('error', function (event) {
        if (event.error || event.message.indexOf('ResizeObserver loop') !== 0) return;
        event.stopImmediatePropagation();
        event.preventDefault();
      });
    </script>
